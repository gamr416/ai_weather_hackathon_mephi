# Perceiver-AE codec training on ERA5 28ch @ 0.5°

data:
  root: data/era5_28ch_0p5_6h_n64.zarr
  crop_size: 192

model:
  patch_size: 16
  dim: 192
  num_latents: 256
  depth: 4
  heads: 4
  codebook_size: 2048
  static_channels: 4
  vq_beta: 0.1
  dropout: 0.0

train:
  seed: 0
  batch_size: 4
  grad_accum: 1
  lr: 1.5e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 20000
  vq_weight: 0.1
  vq_warmup_steps: 1000
  grad_clip: 1.0
  log_every: 20
  val_every: 200
  full_frame_val_every: 2000
  ckpt_every: 1000
  num_workers: 0
  # Each run creates runs/perceiver_0p5/<timestamp>_<tag>/ — old runs are kept
  runs_root: runs/perceiver_0p5
  run_name: n64
  # channel_weights: omit to use DEFAULT_CHANNEL_WEIGHTS in src/data/era5.py
