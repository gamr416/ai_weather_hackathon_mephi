# Perceiver-AE codec training on ERA5 28ch @ 0.5°

data:
  root: data/era5_28ch_0p5_6h_n64.zarr   # switch to _n128 / full when ready
  crop_size: 192                          # patch training for 12GB; null = full 360x720

model:
  patch_size: 16
  dim: 192
  num_latents: 128
  depth: 4
  heads: 4
  codebook_size: 1024
  dropout: 0.0

train:
  seed: 0
  batch_size: 2
  lr: 2.0e-4
  weight_decay: 0.01
  max_steps: 5000          # raise toward 50_000 for real runs
  vq_weight: 0.25
  grad_clip: 1.0
  log_every: 20
  val_every: 200
  ckpt_every: 500
  num_workers: 0
  out_dir: runs/perceiver_0p5_n64
  # device: cuda            # auto if omitted
