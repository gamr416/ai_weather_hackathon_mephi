# Residual-FSQ @ 0.5° — long N=256 quality push (raw CR ≈ ×56)

data:
  root: data/era5_28ch_0p5_6h_n256.zarr
  crop_size: 192

model:
  static_channels: 4
  stem_dim: 64
  stem_blocks: 2
  # coarse
  coarse_patch: 8
  coarse_dim: 256
  coarse_depth: 4
  coarse_dec_depth: 3
  coarse_heads: 8
  coarse_latent: 80
  coarse_levels: 256
  # fine residual
  fine_patch: 4
  fine_dim: 128
  fine_depth: 2
  fine_heads: 4
  fine_latent: 16
  fine_levels: 64
  dropout: 0.1
  drop_path: 0.1

train:
  seed: 0
  batch_size: 2
  grad_accum: 2
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_steps: 1000
  max_steps: 25000
  rate_weight: 0.02
  rate_warmup_steps: 3000
  commit_weight: 0.05
  hf_weight: 0.05
  sst_land_weight: 1.0
  grad_clip: 1.0
  log_every: 20
  val_every: 500
  full_frame_val_every: 5000
  ckpt_every: 2500
  num_workers: 0
  runs_root: runs/residual_fsq_0p5
  run_name: n256s25k
  select_full_frame: true
  channel_weights:
    t2m: 1.0
    mslp: 0.5
    u10: 3.0
    v10: 3.0
    tp6h: 6.0
    sst: 5.0
    tcwv: 1.5
    tcc: 4.0
    T1000: 1.0
    T925: 1.0
    T850: 1.0
    T700: 1.0
    U1000: 3.0
    U925: 3.0
    U850: 3.0
    U700: 3.0
    V1000: 3.0
    V925: 3.0
    V850: 3.0
    V700: 3.0
    Z1000: 0.5
    Z925: 0.5
    Z850: 0.5
    Z700: 0.5
    Q1000: 3.0
    Q925: 3.0
    Q850: 3.0
    Q700: 3.0
